name: Build IPA
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate app icon
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 make_icon.py
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build and archive (no code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project MatchaMusic.xcodeproj \
            -scheme MatchaMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MatchaMusic.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/MatchaMusic.xcarchive/Products/Applications/MatchaMusic.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p build-artifacts
          zip -r "build-artifacts/MatchaMusic.ipa" Payload
          ls -lh build-artifacts/MatchaMusic.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchaMusic-IPA
          path: build-artifacts/MatchaMusic.ipa
          if-no-files-found: error
